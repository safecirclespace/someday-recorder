<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SOMEDAY — Recorder</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #101010;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    h1 {
      font-size: 24px;
      font-weight: 400;
      letter-spacing: 4px;
    }

    p {
      color: #999;
      font-size: 14px;
    }

    .preview {
      width: 100%;
      aspect-ratio: 9 / 16;
      max-height: 65vh;
      background: #222;
      border-radius: 12px;
      overflow: hidden;
      margin: 24px 0;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    button {
      border: 1px solid #555;
      background: transparent;
      color: white;
      padding: 14px 20px;
      border-radius: 30px;
      margin: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .record {
      background: #fff;
      color: #111;
      border: none;
    }

    .use-video {
      background: #fff;
      color: #111;
      border: none;
    }

    #timer {
      font-size: 24px;
      margin: 12px;
      font-variant-numeric: tabular-nums;
    }

    #status {
      min-height: 40px;
      line-height: 1.5;
      color: #bbb;
      overflow-wrap: anywhere;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <main class="container">

    <h1>SOMEDAY</h1>
    <p>A message from who you used to be.</p>

    <div class="preview">
      <video id="camera" autoplay muted playsinline></video>
      <video id="playback" controls playsinline class="hidden"></video>
    </div>

    <div id="timer">00:00</div>

    <div>
      <button id="cameraBtn">Enable Camera</button>
      <button id="recordBtn" class="record" disabled>
        ● Record
      </button>
      <button id="stopBtn" disabled>Stop</button>
      <button id="retakeBtn" disabled>Retake</button>
      <button id="useVideoBtn" class="use-video" disabled>
        Use this video
      </button>
    </div>

    <p id="status">Camera is not active.</p>

  </main>

  <script>
    // ELEMENTS
    const camera = document.getElementById("camera");
    const playback = document.getElementById("playback");

    const cameraBtn = document.getElementById("cameraBtn");
    const recordBtn = document.getElementById("recordBtn");
    const stopBtn = document.getElementById("stopBtn");
    const retakeBtn = document.getElementById("retakeBtn");
    const useVideoBtn = document.getElementById("useVideoBtn");

    const timer = document.getElementById("timer");
    const status = document.getElementById("status");

    // RECORDER STATE
    let stream = null;
    let recorder = null;
    let chunks = [];
    let recordedBlob = null;
    let playbackUrl = null;
    let timerInterval = null;
    let seconds = 0;

    const MAX_DURATION = 60;
    const MAX_SIZE = 10 * 1024 * 1024;

    // TIMER
    function updateTimer() {
      const min = String(
        Math.floor(seconds / 60)
      ).padStart(2, "0");

      const sec = String(
        seconds % 60
      ).padStart(2, "0");

      timer.textContent = `${min}:${sec}`;
    }

    // CAMERA
    async function enableCamera() {
      try {
        status.textContent =
          "Requesting camera and microphone permission...";

        if (
          !navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia
        ) {
          throw new Error(
            "Camera API unavailable. Please use HTTPS."
          );
        }

        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "user"
          },
          audio: true
        });

        camera.srcObject = stream;

        camera.classList.remove("hidden");
        playback.classList.add("hidden");

        recordBtn.disabled = false;
        cameraBtn.disabled = true;

        status.textContent = "Camera ready.";

      } catch (error) {
        status.textContent =
          error.name + ": " + error.message;

        console.error(error);
      }
    }

    // RECORDING FORMAT
    function getRecordingOptions() {
      if (MediaRecorder.isTypeSupported("video/mp4")) {
        return { mimeType: "video/mp4" };
      }

      if (
        MediaRecorder.isTypeSupported(
          "video/webm;codecs=vp9"
        )
      ) {
        return {
          mimeType: "video/webm;codecs=vp9"
        };
      }

      if (
        MediaRecorder.isTypeSupported(
          "video/webm;codecs=vp8"
        )
      ) {
        return {
          mimeType: "video/webm;codecs=vp8"
        };
      }

      if (MediaRecorder.isTypeSupported("video/webm")) {
        return { mimeType: "video/webm" };
      }

      return {};
    }

    // START RECORDING
    function startRecording() {
      if (!stream) {
        status.textContent = "Please enable your camera first.";
        return;
      }

      chunks = [];
      recordedBlob = null;
      seconds = 0;

      updateTimer();

      useVideoBtn.disabled = true;
      retakeBtn.disabled = true;

      try {
        recorder = new MediaRecorder(
          stream,
          getRecordingOptions()
        );

        recorder.ondataavailable = event => {
          if (event.data && event.data.size > 0) {
            chunks.push(event.data);
          }
        };

        recorder.onstop = finishRecording;

        recorder.start();

        recordBtn.disabled = true;
        stopBtn.disabled = false;

        status.textContent = "Recording...";

        timerInterval = setInterval(() => {
          seconds++;
          updateTimer();

          if (seconds >= MAX_DURATION) {
            stopRecording();
          }
        }, 1000);

      } catch (error) {
        status.textContent =
          error.name + ": " + error.message;

        console.error(error);
      }
    }

    // STOP RECORDING
    function stopRecording() {
      clearInterval(timerInterval);

      if (
        recorder &&
        recorder.state === "recording"
      ) {
        recorder.stop();
      }
    }

    // FINISH RECORDING
    function finishRecording() {
      recordedBlob = new Blob(chunks, {
        type: recorder.mimeType
      });

      recordBtn.disabled = true;
      stopBtn.disabled = true;

      if (recordedBlob.size > MAX_SIZE) {
        recordedBlob = null;

        retakeBtn.disabled = false;
        useVideoBtn.disabled = true;

        status.textContent =
          "Video exceeds 10 MB. Please record again.";

        return;
      }

      if (recordedBlob.size === 0) {
        recordedBlob = null;

        retakeBtn.disabled = false;
        useVideoBtn.disabled = true;

        status.textContent =
          "Recording is empty. Please try again.";

        return;
      }

      if (playbackUrl) {
        URL.revokeObjectURL(playbackUrl);
      }

      playbackUrl = URL.createObjectURL(recordedBlob);
      playback.src = playbackUrl;

      camera.classList.add("hidden");
      playback.classList.remove("hidden");

      retakeBtn.disabled = false;
      useVideoBtn.disabled = false;

      status.textContent =
        "Recording complete. Size: " +
        (recordedBlob.size / 1024 / 1024).toFixed(2) +
        " MB. Format: " + recordedBlob.type;
    }

    // RETAKE
    function retakeRecording() {
      recordedBlob = null;
      chunks = [];

      if (playbackUrl) {
        URL.revokeObjectURL(playbackUrl);
        playbackUrl = null;
      }

      playback.pause();
      playback.removeAttribute("src");
      playback.load();

      camera.classList.remove("hidden");
      playback.classList.add("hidden");

      seconds = 0;
      updateTimer();

      recordBtn.disabled = false;
      stopBtn.disabled = true;
      retakeBtn.disabled = true;
      useVideoBtn.disabled = true;

      status.textContent =
        "Camera ready. You can record again.";
    }

    // SEND RECORDING TO SOMEDAY
    function sendRecordingToSomeday() {
      if (!recordedBlob) {
        status.textContent =
          "No recording available.";

        return;
      }

      if (recordedBlob.size > MAX_SIZE) {
        status.textContent =
          "Video must be 10 MB or smaller.";

        return;
      }

      if (!window.opener || window.opener.closed) {
        status.textContent =
          "Please open this recorder from your SOMEDAY app.";

        return;
      }

      try {
        window.opener.postMessage(
          {
            type: "SOMEDAY_RECORDER_VIDEO",
            video: recordedBlob,
            mimeType: recordedBlob.type
          },
          "*"
        );

        useVideoBtn.disabled = true;

        status.textContent =
          "Video sent to SOMEDAY. Return to your capsule.";

      } catch (error) {
        status.textContent =
          "Unable to send video: " + error.message;

        console.error(error);
      }
    }

    // EVENT LISTENERS
    cameraBtn.addEventListener(
      "click",
      enableCamera
    );

    recordBtn.addEventListener(
      "click",
      startRecording
    );

    stopBtn.addEventListener(
      "click",
      stopRecording
    );

    retakeBtn.addEventListener(
      "click",
      retakeRecording
    );

    useVideoBtn.addEventListener(
      "click",
      sendRecordingToSomeday
    );

    // CLEANUP
    window.addEventListener("beforeunload", () => {
      clearInterval(timerInterval);

      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }

      if (playbackUrl) {
        URL.revokeObjectURL(playbackUrl);
      }
    });
  </script>
</body>
</html>
```
